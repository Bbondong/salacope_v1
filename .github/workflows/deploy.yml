name: 🚀 Déploiement SalaCope - Garanti

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Télécharger TOUT le code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Télécharge tout l'historique
        
    - name: 📊 VÉRIFIER ce qui est téléchargé
      run: |
        echo "=== VÉRIFICATION DES FICHIERS ==="
        echo ""
        echo "📁 Liste COMPLÈTE des fichiers :"
        find . -type f -name "*.php" | head -20
        echo ""
        
        echo "📦 Contenu de public/ :"
        ls -la public/ 2>/dev/null || echo "public/ non trouvé"
        echo ""
        
        echo "👑 Contenu de admin/ :"
        ls -la admin/ 2>/dev/null || echo "admin/ non trouvé"
        echo ""
        
        echo "⚙️ Contenu de backend/ :"
        ls -la backend/ 2>/dev/null || echo "backend/ non trouvé"
        echo ""
        
        echo "📈 Statistiques :"
        echo "Fichiers PHP : $(find . -name '*.php' | wc -l)"
        echo "Fichiers JS : $(find . -name '*.js' | wc -l)"
        echo "Fichiers CSS : $(find . -name '*.css' | wc -l)"
        
    - name: 🚀 DÉPLOYER TOUT le contenu
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./                    # TOUT depuis la racine
        server-dir: ./htdocs/            # Vers la racine du serveur
        exclude: |
          **/.git/
          **/.github/
          **/.gitignore
          **/.env*
          **/README.md
          **/LICENSE
        # ⚠️ IMPORTANT : Ces paramètres
        dangerous-clean-slate: true      # Nettoie TOUT avant
        dry-run: false                   # Exécute vraiment
        log-level: verbose               # Voir les détails
        state-name: deploy-state.json
        
    - name: ✅ VÉRIFIER le déploiement
      run: |
        echo ""
        echo "✅ DÉPLOIEMENT EXÉCUTÉ"
        echo ""
        echo "📋 Fichiers déployés :"
        echo "- Tous les fichiers PHP, HTML, CSS, JS"
        echo "- Dossiers : public/, admin/, backend/"
        echo "- Fichiers images, etc."
        echo ""
        echo "❌ Fichiers EXCLUS :"
        echo "- .git/, .github/"
        echo "- .env, README.md"
        echo ""
        echo "🌐 Testez immédiatement :"
        echo "https://salacope.infinityfreeapp.com/"
        echo "https://salacope.infinityfreeapp.com/backend/config.php"
        echo "https://salacope.infinityfreeapp.com/admin/"