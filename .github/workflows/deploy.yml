name: 🧹 Déploiement COMPLET SalaCope

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Télécharger le code
      uses: actions/checkout@v3
      
    - name: 📊 Analyser la structure
      run: |
        echo "=== STRUCTURE DU PROJET ==="
        ls -la
        echo ""
        
        echo "📁 Détails des dossiers :"
        echo "public/ :"
        find public/ -type f -name "*.php" -o -name "*.js" -o -name "*.css" -o -name "*.html" 2>/dev/null | head -10
        echo ""
        
        echo "admin/ :"
        find admin/ -type f -name "*.php" 2>/dev/null | head -10
        echo ""
        
        echo "backend/ :"
        find backend/ -type f -name "*.php" 2>/dev/null | head -10
        
    - name: 🧹 SUPPRIMER TOUT sur le serveur
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./          # Dossier source
        server-dir: ./htdocs/  # Dossier destination
        exclude: |
          **/.git*
          **/.env*
          **/.github/*
        # ⚠️ NETTOYAGE COMPLET AVANT :
        dangerous-clean-slate: true  # ⬅️ SUPPRIME TOUT AVANT
        dry-run: false
        log-level: verbose
        
    - name: 🔧 Préparer structure finale
      run: |
        echo "🔨 Préparation de la structure finale..."
        
        # Créer un dossier pour la structure finale
        mkdir -p final_build
        
        # 1. Copier le contenu de public/ à la racine
        if [ -d "public" ]; then
          echo "📦 Déploiement de public/ à la racine..."
          cp -r public/* final_build/ 2>/dev/null || true
          # Copier les fichiers cachés (.htaccess, etc.)
          find public/ -name ".*" ! -name ".git*" -exec cp --parents {} final_build/ \; 2>/dev/null || true
        fi
        
        # 2. Copier admin/ et backend/
        if [ -d "admin" ]; then
          echo "👑 Copie du dossier admin/..."
          cp -r admin final_build/
        fi
        
        if [ -d "backend" ]; then
          echo "⚙️ Copie du dossier backend/..."
          cp -r backend final_build/
        fi
        
        # Créer un fichier info
        echo "Déploiement du: $(date)" > final_build/deploy_info.txt
        echo "Commit: ${{ github.sha }}" >> final_build/deploy_info.txt
        
        echo ""
        echo "✅ Structure préparée :"
        ls -la final_build/
        
    - name: 🚀 DÉPLOYER la nouvelle version
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./final_build/  # Notre structure préparée
        server-dir: ./htdocs/      # Racine du serveur
        exclude: |
          **/.git*
          **/.env*
          **/.github/*
        # IMPORTANT : false car on a déjà nettoyé
        dangerous-clean-slate: false
        log-level: normal
        
    - name: 🧽 Nettoyer les temporaires
      run: |
        rm -rf final_build
        echo "✅ Fichiers temporaires nettoyés"
        
    - name: ✅ Vérification finale
      run: |
        echo ""
        echo "🎉🎉🎉 DÉPLOIEMENT COMPLET RÉUSSI ! 🎉🎉🎉"
        echo ""
        echo "🧹 ACTION EFFECTUÉE :"
        echo "1. ✅ TOUS les anciens fichiers ont été SUPPRIMÉS"
        echo "2. ✅ NOUVELLE version copiée"
        echo "3. ✅ Structure réinitialisée"
        echo ""
        echo "📁 STRUCTURE FINALE sur le serveur :"
        echo "htdocs/"
        echo "├── index.php          (anciennement dans public/)"
        echo "├── .htaccess          (si présent dans public/)"
        echo "├── css/               (si présent)"
        echo "├── js/                (si présent)"
        echo "├── images/            (si présent)"
        echo "├── admin/             (dossier complet)"
        echo "├── backend/           (dossier complet)"
        echo "└── deploy_info.txt    (info du déploiement)"
        echo ""
        echo "🔗 TES URLS :"
        echo "• Site : https://salacope.infinityfreeapp.com/"
        echo "• Admin : https://salacope.infinityfreeapp.com/admin/"
        echo "• Backend : https://salacope.infinityfreeapp.com/backend/"
        echo ""
        echo "⚠️ ATTENTION :"
        echo "Toutes les sessions, uploads, logs ont été supprimés !"
        echo ""
        echo "🕐 Dernier déploiement : $(date '+%d/%m/%Y %H:%M:%S')"