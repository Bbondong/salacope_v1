
name: 🚀 Déployer SalaCope - Incrémental V2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Télécharger le code
      uses: actions/checkout@v3
      with:
        fetch-depth: 2  # Pour voir les derniers changements
      
    - name: 📊 Analyser les changements
      run: |
        echo "=== CHANGEMENTS DÉTECTÉS ==="
        git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "🔍 Premier commit ou pas d'historique"
        echo ""
        
        echo "=== STRUCTURE ACTUELLE ==="
        ls -la
        echo ""
        
        echo "📁 Contenu des dossiers :"
        [ -d "public" ] && echo "public/: $(ls public/ | wc -l) fichiers"
        [ -d "admin" ] && echo "admin/: $(ls admin/ | wc -l) fichiers"
        [ -d "backend" ] && echo "backend/: $(ls backend/ | wc -l) fichiers"
        
    - name: 🚀 Déployer TOUT (mais en incrémental intelligent)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./          # Prend DIRECTEMENT la racine
        server-dir: ./htdocs/  # Envoie à la racine
        exclude: |
          **/.git*
          **/.github/*
          **/.env*
          **/*.sql
          **/node_modules/
          **/vendor/
          **/README.md
          **/deploy_temp/
        dangerous-clean-slate: false  # ⚠️ FALSE = ne supprime pas
        state-name: ftp-deploy-state-salacope.json
        log-level: verbose
        dry-run: false
        
    - name: 📝 Créer un fichier de version
      run: |
        echo "Création du fichier version.txt..."
        echo "Déploiement du: $(date)" > version.txt
        echo "Commit: ${{ github.sha }}" >> version.txt
        echo "Auteur: ${{ github.actor }}" >> version.txt
        echo "Message: ${{ github.event.head_commit.message }}" >> version.txt
        
    - name: 📤 Envoyer le fichier version
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: ./htdocs/
        only: version.txt
        dangerous-clean-slate: false
        
    - name: ✅ Confirmation finale
      run: |
        echo ""
        echo "🎉🎉🎉 DÉPLOIEMENT RÉUSSI ! 🎉🎉🎉"
        echo ""
        echo "📈 MODE : Déploiement incrémental"
        echo "📊 Seuls les fichiers modifiés ont été mis à jour"
        echo "🛡️ Les fichiers existants sont conservés"
        echo ""
        echo "🔗 TES URLS :"
        echo "• Site : https://salacope.infinityfreeapp.com/"
        echo "• Admin : https://salacope.infinityfreeapp.com/admin/"
        echo "• Backend : https://salacope.infinityfreeapp.com/backend/"
        echo ""
        echo "🔄 Comment ça marche :"
        echo "1. L'action compare les fichiers locaux et distants"
        echo "2. Elle ne transmet que les différences"
        echo "3. Les fichiers inchangés ne sont pas retouchés"
        echo "4. Les sessions et uploads sont conservés"
        echo ""
        echo "🕐 Dernier déploiement : $(date '+%H:%M:%S')"