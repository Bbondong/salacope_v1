name: 🚀 Déployer SalaCope - Public à la racine (Incrémental)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Télécharger le code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Pour voir l'historique des changements
      
    - name: 📋 Analyser la structure et changements
      run: |
        echo "=== STRUCTURE ACTUELLE ==="
        ls -la
        echo ""
        
        echo "=== CHANGEMENTS DANS CE COMMIT ==="
        git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "Premier commit ou impossible de comparer"
        echo ""
        
        echo "📁 Contenu de public/ :"
        ls -la public/ 2>/dev/null || echo "Dossier public/ non trouvé"
        
    - name: 🔧 Préparer la structure finale
      run: |
        echo "Préparation de la structure pour le serveur..."
        
        # Créer un dossier temporaire
        mkdir -p deploy_temp
        
        # 1. Déplacer le contenu de public/ à la racine
        if [ -d "public" ]; then
          echo "📦 Copie du contenu de public/ vers la racine..."
          cp -r public/* deploy_temp/ 2>/dev/null || true
          
          # Copier les fichiers cachés sauf .git
          find public/ -name ".*" ! -name ".git" ! -name ".gitignore" -exec cp --parents {} deploy_temp/ \; 2>/dev/null || true
          
          echo "✅ Contenu de public/ copié à la racine"
        fi
        
        # 2. Ajouter les dossiers admin/ et backend/ à côté
        if [ -d "admin" ]; then
          echo "👑 Copie du dossier admin/..."
          cp -r admin deploy_temp/
          echo "✅ admin/ copié"
        fi
        
        if [ -d "backend" ]; then
          echo "⚙️ Copie du dossier backend/..."
          cp -r backend deploy_temp/
          echo "✅ backend/ copié"
        fi
        
        # Afficher la structure finale
        echo ""
        echo "=== STRUCTURE À DÉPLOYER ==="
        ls -la deploy_temp/ | head -15
        
    - name: 🚀 Déployer sur InfinityFree (Incrémental)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy_temp/    # Prend notre structure préparée
        server-dir: ./htdocs/        # Envoie à la racine du serveur
        exclude: |
          **/.git*
          **/.env*
          **/.github/*
          **/*.sql
          **/node_modules/
          **/vendor/
        # IMPORTANT : FALSE pour ne pas tout supprimer
        dangerous-clean-slate: false  # ⬅️ CHANGE ICI !
        # Activation du mode incrémental
        state-name: salacope-deploy-state.json
        log-level: normal
        dry-run: false
        
    - name: 🧹 Nettoyer temporaire
      run: |
        rm -rf deploy_temp
        echo "✅ Fichiers temporaires nettoyés"
      
    - name: ✅ Confirmation
      run: |
        echo "🎉 DÉPLOIEMENT INCRÉMENTAL RÉUSSI !"
        echo ""
        echo "📁 STRUCTURE SUR LE SERVEUR :"
        echo "htdocs/"
        echo "├── index.php          (anciennement dans public/)"
        echo "├── css/               (anciennement dans public/css/)"
        echo "├── js/                (anciennement dans public/js/)"
        echo "├── admin/             (dossier complet)"
        echo "└── backend/           (dossier complet)"
        echo ""
        echo "✅ SEULS LES FICHIERS MODIFIÉS ONT ÉTÉ MISE À JOUR"
        echo "✅ LES FICHIERS EXISTANTS N'ONT PAS ÉTÉ SUPPRIMÉS"
        echo ""
        echo "🔗 URLS D'ACCÈS :"
        echo "• Site principal : https://salacope.infinityfreeapp.com/"
        echo "• Interface admin : https://salacope.infinityfreeapp.com/admin/"
        echo "• Backend API : https://salacope.infinityfreeapp.com/backend/"
        echo ""
        echo "🕐 Déployé le : $(date)"
        echo ""
        echo "💡 Astuce : Pour un nettoyage complet, déclenchez manuellement"
        echo "avec 'workflow_dispatch' et modifiez dangerous-clean-slate: true"